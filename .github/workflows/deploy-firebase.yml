name: Deploy to Firebase

# Publica as regras do Firestore e o app (Angular) no Firebase Hosting a
# cada push nestas branches, ou manualmente pela aba Actions do GitHub.
# Requer o secret FIREBASE_SERVICE_ACCOUNT (JSON de uma service account do
# Google Cloud) configurado em Settings → Secrets and variables → Actions —
# ver docs/DEPLOY.md para o passo a passo de como gerar essa chave.
on:
  push:
    branches:
      - main
      - claude/github-mobile-development-wmbfgb
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependências
        run: npm install

      - name: Compilar motor de cálculo + Angular
        run: npm run build:web

      - name: Gravar credencial da service account
        run: echo '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}' > "${{ github.workspace }}/firebase-service-account.json"

      - name: Publicar regras do Firestore
        run: npx firebase-tools deploy --only firestore:rules --project precificando-eb48f --non-interactive
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/firebase-service-account.json

      - name: Remover credencial temporária
        if: always()
        run: rm -f "${{ github.workspace }}/firebase-service-account.json"

      - name: Publicar no Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT }}'
          projectId: precificando-eb48f
          channelId: live
